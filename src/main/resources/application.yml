spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:andys}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # TODO: Issue #153. Implement proper DB migration
  application.name: andy.grails.backend
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
info:
  app:
    name: andy.grails.backend
    description: Andy Grails' Website. Backend API.
